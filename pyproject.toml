[project]
name = "finbot-dashboard"
version = "0.1.0"
description = "A read-only Streamlit operations dashboard for Finbot filings."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50,<2",
    "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
